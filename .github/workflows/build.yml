name: Build & Publish

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types: published
  workflow_dispatch:

jobs:
  build-wheel-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
          - arch: x86_64
            os: macos-15-intel
          - arch: arm64
            os: macos-15

    runs-on: ${{ matrix.os }}
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          extras: uv
          output-dir: dist

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-sneedif-wheels-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.whl

  build-wheel-windows:
    runs-on: windows-2025-vs2026
    name: Build wheels on Windows x64

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          pacboy: >-
            cmake:p
            meson:p
            ninja:p
            pkgconf:p
            toolchain:p
            boost:p
            opencl-headers:p
            opencl-icd:p
            uv:p

      - name: Build wheels
        shell: msys2 {0}
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-sneedif-wheels-windows-x64
          path: |
            dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-sneedif-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheel-unix, build-wheel-windows, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vapoursynth-sneedif-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
